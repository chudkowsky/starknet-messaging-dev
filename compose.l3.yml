# L3 (Appchain) infrastructure
#
# Initializes the L3 chain config, starts Katana L3, and deploys appc_msg_sn.
#
# Prerequisites:
#   - compose.l2.yml must be running (katana_l2 reachable on saya_net)
#   - cd cairo && scarb build  (compile contracts before first run)
#
# Usage:
#   docker compose -f compose.l3.yml up
#
# Override L2 state defaults via env vars or --env-file .state/l2.env:
#   CORE_CONTRACT_ADDRESS, FACT_REGISTRY_ADDRESS, CORE_CONTRACT_DEPLOYED_BLOCK
#
# katana_l3 keeps running after setup; L3 RPC exposed on host port 5051.
# Appchain addresses are written to .state/l3.env for use by compose.e2e.yml.

x-katana-common: &katana-common
  image: ghcr.io/dojoengine/katana:v1.7.0-snos.4
  dns: 127.0.0.11
  networks: [saya_net]
  restart: "no"
  volumes:
    - shared:/shared
  entrypoint: ["/bin/sh", "-c"]

x-sozo-common: &sozo-common
  build:
    context: docker
    dockerfile: Dockerfile.sozo
    args:
      SOZO_VERSION: "1.8.6"
  dns: 127.0.0.11
  networks: [saya_net]
  restart: "no"
  volumes:
    - ./cairo/target/dev:/artifacts:ro

services:
  katana_init:
    <<: *katana-common
    container_name: katana_init
    command:
      - |
        until curl -sf http://katana_l2:5050 > /dev/null 2>&1; do
          echo "Waiting for katana_l2..."; sleep 2
        done
        katana init \
          --settlement-chain http://katana_l2:5050 \
          --output-path /shared/katana_config \
          --id ${L3_CHAIN_ID:-katana-l3} \
          --settlement-contract ${CORE_CONTRACT_ADDRESS:-0x1c8a55203cd99a6bfaf7cd91ae2ad953eff67b584826edab1857ca2e3c5db5d} \
          --settlement-contract-deployed-block ${CORE_CONTRACT_DEPLOYED_BLOCK:-4} \
          --settlement-facts-registry ${FACT_REGISTRY_ADDRESS:-0x3eb0d510d1238120bf7f9d176faafe0c7066797a86be985855952f87769d3bd}

  katana_l3:
    <<: *katana-common
    container_name: katana_l3
    depends_on:
      katana_init:
        condition: service_completed_successfully
    ports:
      - "${L3_PORT:-5051}:5050"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5050 || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    command:
      - |
        katana --chain /shared/katana_config --http.addr 0.0.0.0

  appc_msg_sn_deploy:
    <<: *sozo-common
    container_name: appc_msg_sn_deploy
    depends_on:
      katana_l3:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sozo declare /artifacts/sn_msg_dev_appc_msg_sn.contract_class.json \
          --account-address ${APPC_ACCOUNT_ADDRESS:-0x1f401c745d3dba9b9da11921d1fb006c96f571e9039a0ece3f3b0dc14f04c3d} \
          --private-key ${APPC_PRIVATE_KEY:-0x7230b49615d175307d580c33d6fda61fc7b9aec91df0f5c1a5ebe3b8cbfee02} \
          --l1-data-gas 20000000000 \
          --l1-gas 20000000000 \
          --l1-gas-price 20000000000 \
          --l2-gas-price 20000000000 \
          --l1-data-gas-price 20000000000 \
          --l2-gas 20000000000 \
          --rpc-url http://katana_l3:5050

        sozo deploy 0x03653979a4d0bcd57a755a32a182d0650d9cd45cd3ff3be28a20c972e1c9c29c \
          --account-address ${APPC_ACCOUNT_ADDRESS:-0x1f401c745d3dba9b9da11921d1fb006c96f571e9039a0ece3f3b0dc14f04c3d} \
          --private-key ${APPC_PRIVATE_KEY:-0x7230b49615d175307d580c33d6fda61fc7b9aec91df0f5c1a5ebe3b8cbfee02} \
          --salt 0x1234 \
          --l1-data-gas 20000000000 \
          --l1-gas 20000000000 \
          --l1-gas-price 20000000000 \
          --l2-gas-price 20000000000 \
          --l1-data-gas-price 20000000000 \
          --l2-gas 20000000000 \
          --rpc-url http://katana_l3:5050

  # Writes deterministic appchain addresses to .state/l3.env.
  # Account is generated from the chain config (same config → same accounts).
  # Contract address is deterministic: same deployer, same class hash, same salt.
  write_state:
    image: alpine:3
    container_name: l3_write_state
    depends_on:
      appc_msg_sn_deploy:
        condition: service_completed_successfully
    volumes:
      - ./.state:/state
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /state
        cat > /state/l3.env << 'EOF'
        APPC_ACCOUNT_ADDRESS=0x1f401c745d3dba9b9da11921d1fb006c96f571e9039a0ece3f3b0dc14f04c3d
        APPC_PRIVATE_KEY=0x7230b49615d175307d580c33d6fda61fc7b9aec91df0f5c1a5ebe3b8cbfee02
        APPC_MSG_SN_ADDRESS=0x00be8c1b5ddc2edacb375bc8734b8a96d618f8213df8bd531e60fa338c0aa429
        EOF
        echo "L3 state written to .state/l3.env:"
        cat /state/l3.env

networks:
  saya_net:
    name: saya_net

volumes:
  shared: {}
